AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  ModelShield Frontend. Private S3 static bucket + CloudFront Origin Access Control
  (HTTPS edge delivery) with strict security response headers and optional WAFv2.

Parameters:
  WafWebAclArn:
    Type: String
    Default: ""
    Description: Optional global (us-east-1) AWS WAFv2 WebACL ARN for CloudFront edge protection.

  EnableCloudFrontWaf:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Provision a rate-limited CloudFront WAFv2 WebACL when deployed in us-east-1.

Conditions:
  HasWafWebAcl: !Not [!Equals [!Ref WafWebAclArn, ""]]
  CreateCloudFrontWaf: !And
    - !Equals [!Ref EnableCloudFrontWaf, "true"]
    - !Equals [!Ref "AWS::Region", "us-east-1"]
    - !Equals [!Ref WafWebAclArn, ""]

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "modelshield-frontend-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          XSSProtection:
            ModeBlock: true
            Protection: true
            Override: true
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; connect-src 'self' https://*.execute-api.ap-southeast-2.amazonaws.com https://cognito-idp.ap-southeast-2.amazonaws.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'"
            Override: true

  FrontendWebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: CreateCloudFrontWaf
    Properties:
      Name: !Sub "${AWS::StackName}-cf-waf"
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${AWS::StackName}-cf-waf"
      Rules:
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: CommonRuleSet
        - Name: EdgeRateLimit
          Priority: 2
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 1000
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: EdgeRateLimit

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: ModelShield live benchmark deck
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_All
        WebACLId: !If
          - HasWafWebAcl
          - !Ref WafWebAclArn
          - !If
            - CreateCloudFrontWaf
            - !GetAtt FrontendWebAcl.Arn
            - !Ref "AWS::NoValue"
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          # AWS Managed CachingOptimized policy
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref FrontendResponseHeadersPolicy
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

Outputs:
  BucketName:
    Description: Private S3 bucket holding the built frontend bundle
    Value: !Ref FrontendBucket
  DistributionId:
    Description: CloudFront distribution ID
    Value: !Ref FrontendDistribution
  FrontendUrl:
    Description: Live HTTPS URL for the ModelShield UI
    Value: !Sub "https://${FrontendDistribution.DomainName}"
