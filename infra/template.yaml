AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  ModelShield. Hardened serverless AI incident-triage gateway with Cognito JWT
  auth, per-user/per-tenant rate limiting, tenant-isolated DynamoDB storage &
  TTL cache, prompt-injection safeguards, and cost-aware AWS security controls.

Parameters:
  StackVersion:
    Type: String
    Default: v1
    AllowedValues:
      - v1
      - v2
    Description: Logical stack version, emitted in telemetry and EMF dimensions.

  HeavyModelId:
    Type: String
    Default: apac.amazon.nova-pro-v1:0
    AllowedValues:
      - apac.amazon.nova-pro-v1:0
    Description: Bedrock cross-region inference profile for the heavy tier.

  LightModelId:
    Type: String
    Default: apac.amazon.nova-lite-v1:0
    AllowedValues:
      - apac.amazon.nova-lite-v1:0
    Description: Bedrock cross-region inference profile for the light tier (v2).

  AllowedOrigins:
    Type: CommaDelimitedList
    Default: "https://d1856jwkm5m4pg.cloudfront.net"
    Description: Explicit comma-separated CORS origins permitted to call this API.

  ExternalCognitoIssuer:
    Type: String
    Default: ""
    Description: Optional existing Cognito UserPool issuer URL (leave empty to provision one).

  ExternalCognitoClientId:
    Type: String
    Default: ""
    Description: Optional existing Cognito App Client ID when reusing a shared UserPool.

  ReservedConcurrency:
    Type: Number
    Default: 10
    MinValue: 0
    Description: Reserved Lambda concurrency ceiling (0 disables explicit reservation).

  LogRetentionDays:
    Type: Number
    Default: 30
    MinValue: 7
    MaxValue: 3653
    Description: CloudWatch Logs retention in days for auditability.

  EnableCloudTrail:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Provision an encrypted account CloudTrail S3 audit trail when true.

  EnablePaidSecurityAddons:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Opt-in flag for paid AWS threat-detection add-ons (GuardDuty).

Conditions:
  IsV2: !Equals [!Ref StackVersion, "v2"]
  UseExternalCognito: !Not [!Equals [!Ref ExternalCognitoIssuer, ""]]
  CreateCognitoPool: !Equals [!Ref ExternalCognitoIssuer, ""]
  HasReservedConcurrency: !Not [!Equals [!Ref ReservedConcurrency, 0]]
  UseCloudTrail: !Equals [!Ref EnableCloudTrail, "true"]
  UsePaidSecurityAddons: !Equals [!Ref EnablePaidSecurityAddons, "true"]

Globals:
  Function:
    Runtime: python3.13
    Timeout: 29

Resources:
  # ---------------------------------------------------------------------------
  # Identity: Cognito User Pool + Public SPA Client + Admin Role Group
  # ---------------------------------------------------------------------------
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Condition: CreateCognitoPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      Schema:
        - Name: tenant_id
          AttributeDataType: String
          Mutable: true
          Required: false

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: CreateCognitoPool
    Properties:
      ClientName: !Sub "${AWS::StackName}-client"
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      SupportedIdentityProviders:
        - COGNITO
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 7
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  CognitoAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Condition: CreateCognitoPool
    Properties:
      GroupName: admin
      Description: Administrative group authorized for /stats access
      UserPoolId: !Ref CognitoUserPool

  # ---------------------------------------------------------------------------
  # Edge: HTTP API with Cognito JWT Authorizer, Strict CORS, Access Logs & Throttle
  # ---------------------------------------------------------------------------
  HttpApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${AWS::StackName}-access"
      RetentionInDays: !Ref LogRetentionDays

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: ModelShield authenticated triage HTTP API
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !If
                - UseExternalCognito
                - !Ref ExternalCognitoIssuer
                - !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}"
              audience:
                - !If
                  - UseExternalCognito
                  - !Ref ExternalCognitoClientId
                  - !Ref CognitoUserPoolClient
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        MaxAge: 600
      AccessLogSettings:
        DestinationArn: !GetAtt HttpApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","method":"$context.httpMethod","path":"$context.path","status":"$context.status","latencyMs":"$context.responseLatency","error":"$context.error.messageString"}'
      DefaultRouteSettings:
        ThrottlingBurstLimit: !If [IsV2, 50, 25]
        ThrottlingRateLimit: !If [IsV2, 25, 10]

  # ---------------------------------------------------------------------------
  # Data: Encrypted DynamoDB tables with TTL retention & Point-in-Time Recovery
  # ---------------------------------------------------------------------------
  TicketsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-tickets"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ticket_id
          AttributeType: S
        - AttributeName: tenant_id
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: ticket_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: TenantIndex
          KeySchema:
            - AttributeName: tenant_id
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      DeletionProtectionEnabled: false

  RateLimitTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-rate-limits"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cache_key
          AttributeType: S
      KeySchema:
        - AttributeName: cache_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      DeletionProtectionEnabled: false

  ResponseCacheTable:
    Type: AWS::DynamoDB::Table
    Condition: IsV2
    Properties:
      TableName: !Sub "${AWS::StackName}-response-cache"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cache_key
          AttributeType: S
      KeySchema:
        - AttributeName: cache_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      DeletionProtectionEnabled: false

  # ---------------------------------------------------------------------------
  # Compute: Least-privilege Lambda handler with concurrency ceiling
  # ---------------------------------------------------------------------------
  TriageFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/src/
      Handler: handler.lambda_handler
      Description: ModelShield authenticated triage handler
      Architectures:
        - !If
          - IsV2
          - arm64
          - x86_64
      MemorySize: !If [IsV2, 256, 512]
      ReservedConcurrentExecutions: !If [HasReservedConcurrency, !Ref ReservedConcurrency, !Ref "AWS::NoValue"]
      Environment:
        Variables:
          STACK_VERSION: !Ref StackVersion
          MODEL_ID: !Ref HeavyModelId
          HEAVY_MODEL_ID: !Ref HeavyModelId
          LIGHT_MODEL_ID: !Ref LightModelId
          TICKETS_TABLE: !Ref TicketsTable
          TICKETS_TENANT_INDEX: TenantIndex
          RATE_LIMIT_TABLE: !Ref RateLimitTable
          RESPONSE_CACHE_TABLE: !If
            - IsV2
            - !Ref ResponseCacheTable
            - ""
          ALLOWED_ORIGINS: !Join [",", !Ref AllowedOrigins]
          COGNITO_ISSUER: !If
            - UseExternalCognito
            - !Ref ExternalCognitoIssuer
            - !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}"
          COGNITO_CLIENT_ID: !If
            - UseExternalCognito
            - !Ref ExternalCognitoClientId
            - !Ref CognitoUserPoolClient
          USER_RATE_LIMIT_PER_MINUTE: "30"
          TENANT_RATE_LIMIT_PER_MINUTE: "120"
          TICKET_TTL_SECONDS: "2592000"
          CONFIDENCE_THRESHOLD: "0.85"
          ARCHITECTURE: !If
            - IsV2
            - arm64
            - x86_64
          LOG_LEVEL: INFO
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: TicketsWriteAndTenantQuery
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:Query
              Resource:
                - !GetAtt TicketsTable.Arn
                - !Sub "${TicketsTable.Arn}/index/TenantIndex"
            - Sid: RateLimitAtomicCounters
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt RateLimitTable.Arn
            - !If
              - IsV2
              - Sid: ResponseCacheReadWrite
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource:
                  - !GetAtt ResponseCacheTable.Arn
              - !Ref AWS::NoValue
        - Version: "2012-10-17"
          Statement:
            - Sid: BedrockLeastPrivilegeInvoke
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${HeavyModelId}"
                - !If
                  - IsV2
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${LightModelId}"
                  - !Ref AWS::NoValue
                - "arn:aws:bedrock:ap-*::foundation-model/amazon.nova-pro-v1:0"
                - !If
                  - IsV2
                  - "arn:aws:bedrock:ap-*::foundation-model/amazon.nova-lite-v1:0"
                  - !Ref AWS::NoValue
      Events:
        TriagePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /triage
            Method: POST
        HealthGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE
        StatsGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /stats
            Method: GET

  TriageFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${TriageFunction}"
      RetentionInDays: !Ref LogRetentionDays

  # ---------------------------------------------------------------------------
  # Security Monitoring & Optional Cost-Gated AWS Audit Controls
  # ---------------------------------------------------------------------------
  TriageErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-lambda-errors"
      AlarmDescription: Triggers on Lambda handler execution errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref TriageFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-api-5xx"
      AlarmDescription: Triggers on elevated API Gateway 5xx responses
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  CloudTrailBucket:
    Type: AWS::S3::Bucket
    Condition: UseCloudTrail
    Properties:
      BucketName: !Sub "${AWS::StackName}-cloudtrail-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAuditLogs90Days
            Status: Enabled
            ExpirationInDays: 90

  CloudTrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: UseCloudTrail
    Properties:
      Bucket: !Ref CloudTrailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt CloudTrailBucket.Arn
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${CloudTrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control

  ModelShieldTrail:
    Type: AWS::CloudTrail::Trail
    Condition: UseCloudTrail
    DependsOn: CloudTrailBucketPolicy
    Properties:
      TrailName: !Sub "${AWS::StackName}-trail"
      IsLogging: true
      S3BucketName: !Ref CloudTrailBucket
      IncludeGlobalServiceEvents: false
      IsMultiRegionTrail: false
      EnableLogFileValidation: true

  GuardDutyDetector:
    Type: AWS::GuardDuty::Detector
    Condition: UsePaidSecurityAddons
    Properties:
      Enable: true

  # ---------------------------------------------------------------------------
  # Observability: EMF metrics land in ModelShield/Triage
  # ---------------------------------------------------------------------------
  TriageDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}-triage"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Average Bedrock cost per triage request (USD)",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "period": 300,
                "metrics": [
                  [ "ModelShield/Triage", "EstimatedCostUSD", "StackVersion", "${StackVersion}", { "stat": "Average", "label": "${StackVersion} avg cost/request" } ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "p95 triage latency (ms)",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "period": 300,
                "metrics": [
                  [ "ModelShield/Triage", "LatencyMs", "StackVersion", "${StackVersion}", { "stat": "p95", "label": "${StackVersion} p95" } ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Frontier tokens consumed",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "period": 300,
                "metrics": [
                  [ "ModelShield/Triage", "FrontierTokens", "StackVersion", "${StackVersion}", { "stat": "Sum", "label": "${StackVersion} frontier tokens" } ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Cache hits / escalations / fallbacks",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "period": 300,
                "metrics": [
                  [ "ModelShield/Triage", "CacheHit", "StackVersion", "${StackVersion}", { "stat": "Sum", "label": "cache hits" } ],
                  [ "ModelShield/Triage", "Escalated", "StackVersion", "${StackVersion}", { "stat": "Sum", "label": "escalations" } ],
                  [ "ModelShield/Triage", "FallbackTriggered", "StackVersion", "${StackVersion}", { "stat": "Sum", "label": "fallbacks" } ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 12, "width": 24, "height": 6,
              "properties": {
                "title": "Lambda compute footprint (GB-seconds) and errors",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "period": 300,
                "metrics": [
                  [ "ModelShield/Triage", "LambdaGBSeconds", "StackVersion", "${StackVersion}", { "stat": "Sum", "label": "${StackVersion} GB-seconds" } ],
                  [ "AWS/Lambda", "Errors", "FunctionName", "${TriageFunction}", { "stat": "Sum", "label": "handler errors", "yAxis": "right" } ]
                ]
              }
            }
          ]
        }

Outputs:
  ApiUrl:
    Description: Base URL for the triage API
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  HealthUrl:
    Description: Public minimal health check endpoint
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/health"

  CognitoUserPoolId:
    Condition: CreateCognitoPool
    Description: Cognito User Pool ID for JWT issuance
    Value: !Ref CognitoUserPool

  CognitoClientId:
    Condition: CreateCognitoPool
    Description: Cognito App Client ID
    Value: !Ref CognitoUserPoolClient

  TriageTableName:
    Description: DynamoDB table holding tenant-scoped triage records
    Value: !Ref TicketsTable

  RateLimitTableName:
    Description: DynamoDB atomic counter table for rate limiting
    Value: !Ref RateLimitTable

  ResponseCacheTableName:
    Condition: IsV2
    Description: DynamoDB TTL cache table (v2 only)
    Value: !Ref ResponseCacheTable

  TriageFunctionName:
    Description: Lambda function name
    Value: !Ref TriageFunction

  DashboardName:
    Description: CloudWatch dashboard name
    Value: !Ref TriageDashboard
